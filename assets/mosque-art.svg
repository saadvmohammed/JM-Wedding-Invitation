<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="100%" height="100%">
  <defs>
    <linearGradient id="goldLineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9a7428"/>
      <stop offset="30%" stop-color="#e8c874"/>
      <stop offset="50%" stop-color="#fcf4dd"/>
      <stop offset="70%" stop-color="#e8c874"/>
      <stop offset="100%" stop-color="#9a7428"/>
    </linearGradient>
  </defs>

  <g stroke="url(#goldLineGrad)" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Main Center Dome -->
    <path d="M 150,130 C 150,75 250,75 250,130 Z" />
    <path d="M 200,60 L 200,75" />
    <!-- Crescent Moon on Center Dome -->
    <path d="M 197,55 A 5,5 0 1,1 204,57 A 4,4 0 1,0 197,55 Z" fill="url(#goldLineGrad)" />

    <!-- Left Flanking Dome -->
    <path d="M 90,130 C 90,95 150,95 150,130 Z" />
    <path d="M 120,87 L 120,95" />
    <path d="M 118,83 A 3.5,3.5 0 1,1 123,85 A 3,3 0 1,0 118,83 Z" fill="url(#goldLineGrad)" />

    <!-- Right Flanking Dome -->
    <path d="M 250,130 C 250,95 310,95 310,130 Z" />
    <path d="M 280,87 L 280,95" />
    <path d="M 278,83 A 3.5,3.5 0 1,1 283,85 A 3,3 0 1,0 278,83 Z" fill="url(#goldLineGrad)" />

    <!-- Far Left Minaret -->
    <path d="M 45,160 L 45,70 L 55,60 L 65,70 L 65,160" />
    <path d="M 40,70 L 70,70" />
    <path d="M 42,110 L 68,110" />
    <path d="M 55,48 L 55,60" />
    <path d="M 53,44 A 3,3 0 1,1 58,46 A 2.5,2.5 0 1,0 53,44 Z" fill="url(#goldLineGrad)" />

    <!-- Far Right Minaret -->
    <path d="M 335,160 L 335,70 L 345,60 L 355,70 L 355,160" />
    <path d="M 330,70 L 360,70" />
    <path d="M 332,110 L 358,110" />
    <path d="M 345,48 L 345,60" />
    <path d="M 343,44 A 3,3 0 1,1 348,46 A 2.5,2.5 0 1,0 343,44 Z" fill="url(#goldLineGrad)" />

    <!-- Mosque Arched Entrance & Windows -->
    <path d="M 180,160 L 180,135 C 180,120 220,120 220,135 L 220,160" />
    <path d="M 115,160 L 115,140 C 115,130 135,130 135,140 L 135,160" />
    <path d="M 265,160 L 265,140 C 265,130 285,130 285,140 L 285,160" />

    <!-- Base Line & Decorative Lattice -->
    <line x1="30" y1="160" x2="370" y2="160" />
    <line x1="20" y1="164" x2="380" y2="164" stroke-width="1" />
    
    <!-- Stars in Sky background -->
    <circle cx="100" cy="45" r="1" fill="url(#goldLineGrad)" />
    <circle cx="160" cy="35" r="1.5" fill="url(#goldLineGrad)" />
    <circle cx="240" cy="30" r="1.2" fill="url(#goldLineGrad)" />
    <circle cx="300" cy="45" r="1" fill="url(#goldLineGrad)" />
  </g>
</svg>
