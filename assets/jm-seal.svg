<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <!-- Rich Gold Foil Gradients -->
    <radialGradient id="sealBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fdf6e2"/>
      <stop offset="25%" stop-color="#e8c874"/>
      <stop offset="65%" stop-color="#c9a24b"/>
      <stop offset="90%" stop-color="#8c641c"/>
      <stop offset="100%" stop-color="#5a3d09"/>
    </radialGradient>
    
    <linearGradient id="goldLinear" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="20%" stop-color="#fdf4d7"/>
      <stop offset="50%" stop-color="#e8c874"/>
      <stop offset="80%" stop-color="#b88d32"/>
      <stop offset="100%" stop-color="#7a5510"/>
    </linearGradient>
    
    <filter id="waxShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#c9a24b" flood-opacity="0.3"/>
    </filter>

    <filter id="innerEmboss">
      <feComponentTransfer in="SourceAlpha">
        <feFuncA type="linear" slope="0.7"/>
      </feComponentTransfer>
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feOffset dx="-1" dy="-1.5" result="offset"/>
      <feComposite operator="out" in2="SourceGraphic" result="inverse"/>
      <feFlood flood-color="#fff" flood-opacity="0.6" result="color"/>
      <feComposite operator="in" in2="inverse" result="shadow"/>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
  </defs>

  <g filter="url(#waxShadow)">
    <!-- Scalloped Outer Wax Seal Edge -->
    <path d="M 150,12 
             C 160,12 165,18 174,20 C 183,22 190,17 198,22 C 206,27 209,34 216,41 C 223,48 232,50 237,58 C 242,66 240,75 243,84 C 246,93 253,99 254,109 C 255,119 249,127 248,137 C 247,147 251,156 248,166 C 245,176 238,183 233,192 C 228,201 227,211 220,218 C 213,225 204,226 195,231 C 186,236 180,244 170,247 C 160,250 151,245 141,246 C 131,247 124,253 114,251 C 104,249 97,242 88,238 C 79,234 70,234 62,227 C 54,220 54,210 48,202 C 42,194 34,188 30,179 C 26,170 29,160 27,150 C 25,140 20,131 21,121 C 22,111 29,104 30,94 C 31,84 27,75 30,66 C 33,57 41,52 47,44 C 53,36 57,28 66,23 C 75,18 84,21 94,18 C 104,15 111,10 121,10 C 131,10 140,12 150,12 Z" 
          fill="url(#sealBg)" stroke="url(#goldLinear)" stroke-width="2.5" />

    <!-- Inner Concentric Beveled Rings -->
    <circle cx="150" cy="130" r="94" fill="none" stroke="url(#goldLinear)" stroke-width="2.5" opacity="0.85"/>
    <circle cx="150" cy="130" r="88" fill="none" stroke="#7a5510" stroke-width="1.5" opacity="0.9"/>
    <circle cx="150" cy="130" r="84" fill="none" stroke="url(#goldLinear)" stroke-width="1" stroke-dasharray="3,3"/>

    <!-- Top Crown Wreath Motif -->
    <g fill="url(#goldLinear)" filter="url(#innerEmboss)" transform="translate(150, 72) scale(0.85)">
      <!-- Crown -->
      <path d="M -18,-18 L -24,-30 L -10,-24 L 0,-34 L 10,-24 L 24,-30 L 18,-18 Z" />
      <circle cx="-24" cy="-32" r="2.5" />
      <circle cx="-10" cy="-26" r="2" />
      <circle cx="0" cy="-36" r="3" />
      <circle cx="10" cy="-26" r="2" />
      <circle cx="24" cy="-32" r="2.5" />
    </g>

    <!-- Laurel Wreath Leaves (Left & Right) -->
    <g fill="url(#goldLinear)" stroke="#5a3d09" stroke-width="0.5">
      <!-- Left Laurel -->
      <path d="M 82,130 C 80,105 90,85 105,75 C 102,82 100,92 102,102 C 95,95 90,88 88,80 C 85,92 88,102 94,110 C 85,108 80,102 78,95 C 78,108 84,118 92,124 C 84,122 78,118 76,110 C 76,122 84,132 94,136 Z" />
      <!-- Right Laurel -->
      <path d="M 218,130 C 220,105 210,85 195,75 C 198,82 200,92 198,102 C 205,95 210,88 212,80 C 215,92 212,102 206,110 C 215,108 220,102 222,95 C 222,108 216,118 208,124 C 216,122 222,118 224,110 C 224,122 216,132 206,136 Z" />
    </g>

    <!-- Intertwined Monogram "JM" Script -->
    <g fill="url(#goldLinear)" filter="url(#innerEmboss)" transform="translate(150, 138)">
      <!-- J Letter -->
      <path d="M -32,-35 C -25,-35 -18,-33 -12,-38 C -10,-40 -5,-38 -8,-32 C -15,-20 -20,-5 -22,10 C -24,25 -18,34 -5,32 C 5,30 10,20 8,10 C 7,5 12,5 12,9 C 13,24 4,38 -10,40 C -26,42 -35,28 -33,10 C -31,-6 -25,-22 -18,-32 C -22,-30 -28,-30 -32,-35 Z" />
      <!-- M Letter Intertwined -->
      <path d="M -10,-28 C -2,-28 8,-12 14,-2 C 18,-16 26,-30 35,-28 C 42,-26 44,-16 40,-2 C 37,10 32,24 30,34 C 29,38 23,38 25,32 C 27,22 32,10 34,2 C 36,-6 32,-18 26,-18 C 18,-18 10,-2 -2,22 C -5,25 -10,22 -8,18 C -2,6 8,-15 2,-20 C -2,-23 -6,-20 -10,-28 Z" />
    </g>
    
    <!-- Stars / Diamond Flourish Base -->
    <g fill="url(#goldLinear)" transform="translate(150, 195)">
      <polygon points="0,-6 2,-2 6,0 2,2 0,6 -2,2 -6,0 -2,-2" />
      <polygon points="-25,-4 -23,-1 -20,0 -23,1 -25,4 -27,1 -30,0 -27,-1" />
      <polygon points="25,-4 27,-1 30,0 27,1 25,4 23,1 20,0 23,-1" />
    </g>
  </g>
</svg>
